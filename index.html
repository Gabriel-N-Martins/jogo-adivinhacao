<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Jogo de Adivinhação</h1>
  </header>

  <main>
    <section id="jogo">
      <p id="instrucoes">
        Estou pensando em um número entre 1 e 100. Você tem 10 tentativas
        para descobrir qual é. A cada chute, eu digo se o número secreto
        é maior ou menor.
      </p>

      <label for="palpite">Seu palpite:</label>
      <input type="number" id="palpite" min="1" max="100" placeholder="Digite de 1 a 100" required>

      <button id="chutar" type="button">Chutar</button>
      <button id="reiniciar" type="button" hidden>Jogar de novo</button>

      <p id="mensagem"></p>
      <p id="tentativas"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gabriel. Ciência da Computação, UNASP.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
